AWSTemplateFormatVersion: '2010-09-09'
Description: Tindy CloudFront edge with a private S3 frontend and optional VPC origin.

Parameters:
  FrontendBucketName:
    Type: String
    Description: FrontendBucketName output from tindy-foundation in the same Region.
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
    ConstraintDescription: Use the generated S3 frontend bucket name without dots.

  EdgeMode:
    Type: String
    Default: maintenance
    AllowedValues: [maintenance, live]

  VpcOriginId:
    Type: String
    Default: ''
    Description: VpcOriginId output from tindy-runtime. Required in live mode.

  AlbDnsName:
    Type: String
    Default: ''
    AllowedPattern: '(internal-[a-zA-Z0-9-]+\.us-east-1\.elb\.amazonaws\.com)?'
    Description: AlbDnsName output from tindy-runtime. Required in live mode.

Rules:
  RequireLiveOrigin:
    RuleCondition: !Equals [!Ref EdgeMode, live]
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref VpcOriginId, '']]
          - !Not [!Equals [!Ref AlbDnsName, '']]
        AssertDescription: Live mode requires the VPC origin ID and internal ALB DNS name.

Conditions:
  IsLive: !Equals [!Ref EdgeMode, live]

# Set Project=Tindy, Environment=tindy, and Owner on the stack at deployment.
Resources:
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend'
        Description: Signs CloudFront reads from the private Tindy frontend bucket.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  MaintenanceRoutingFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-maintenance-routing'
      AutoPublish: true
      FunctionConfig:
        Comment: Handles maintenance responses and known Tindy frontend routes.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        const spaRoutes = [
          '/', '/ai', '/ai-studio', '/applications', '/auth/oauth/callback',
          '/candidates', '/components', '/create-project', '/discover',
          '/interests', '/leader', '/leader/applications', '/login', '/messages',
          '/notifications', '/onboarding', '/privacypolicy', '/profile',
          '/projects', '/register', '/saved', '/settings', '/team', '/termsofservice'
        ];
        const spaDetailRoute = /^\/(?:(?:candidate|team|users)\/[^/.]+|project\/[^/.]+(?:\/(?:applications|edit|workspace))?|projects\/[^/.]+\/applications)$/;

        function handler(event) {
          const request = event.request;
          const path = request.uri.toLowerCase().replace(/\/+$/, '') || '/';

          if (/^\/(?:api|hubs)(?:\/|$)|^\/signin-(?:google|github)$/.test(path)) {
            const response = {
              statusCode: 503,
              statusDescription: 'Service Unavailable',
              headers: {
                'cache-control': { value: 'no-store' },
                'content-type': { value: 'application/json; charset=utf-8' }
              }
            };
            if (request.method !== 'HEAD') {
              response.body = '{"status":"maintenance"}';
            }
            return response;
          }

          // The behavior accepts all methods so backend POST requests reach this function.
          if (request.method !== 'GET' && request.method !== 'HEAD') {
            return {
              statusCode: 405,
              statusDescription: 'Method Not Allowed',
              headers: { allow: { value: 'GET, HEAD' } }
            };
          }

          if (spaRoutes.includes(path) || spaDetailRoute.test(path)) {
            request.uri = '/index.html';
          }
          return request;
        }

  EdgeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Tindy application edge
        Enabled: true
        HttpVersion: http2
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend-s3
            DomainName: !Sub '${FrontendBucketName}.s3.${AWS::Region}.${AWS::URLSuffix}'
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - !If
            - IsLive
            - Id: runtime-vpc
              DomainName: !Ref AlbDnsName
              VpcOriginConfig:
                VpcOriginId: !Ref VpcOriginId
                OriginReadTimeout: 120
            - !Ref AWS::NoValue
        CustomErrorResponses:
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          # AWS-managed CachingDisabled for HTML and maintenance responses.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt MaintenanceRoutingFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: '/assets/*'
            TargetOriginId: frontend-s3
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            Compress: true
            # AWS-managed CachingOptimized for content-hashed Vite assets.
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Forward the viewer Host, Authorization, cookies, WebSocket headers,
          # and the CloudFront-generated protocol and viewer address headers.
          - !If
            - IsLive
            - PathPattern: '/api'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue
          - !If
            - IsLive
            - PathPattern: '/api/*'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue
          - !If
            - IsLive
            - PathPattern: '/hubs'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue
          - !If
            - IsLive
            - PathPattern: '/hubs/*'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue
          - !If
            - IsLive
            - PathPattern: '/signin-google'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue
          - !If
            - IsLive
            - PathPattern: '/signin-github'
              TargetOriginId: runtime-vpc
              ViewerProtocolPolicy: https-only
              AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
              CachedMethods: [GET, HEAD]
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
              OriginRequestPolicyId: 33f36d7e-f396-46d9-90e0-52428a34d9dc
            - !Ref AWS::NoValue

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowReadFromTindyDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${FrontendBucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${EdgeDistribution}'

Outputs:
  DistributionId:
    Value: !Ref EdgeDistribution

  DistributionDomainName:
    Value: !GetAtt EdgeDistribution.DomainName

  EdgeMode:
    Value: !Ref EdgeMode
