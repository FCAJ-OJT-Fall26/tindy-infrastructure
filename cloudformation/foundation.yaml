AWSTemplateFormatVersion: '2010-09-09'
Description: Tindy persistent storage, image registry, application secrets, and optional GitHub OIDC.

Parameters:
  InfraPlannerEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Allow the Tindy infrastructure repository to prepare Change Sets from main.

  GitHubOidcProviderMode:
    Type: String
    Default: Disabled
    AllowedValues: [Disabled, Create, Existing]
    Description: Create the account-wide GitHub OIDC provider or use the provider already configured in IAM.

  FrontendDeployOidcSubject:
    Type: String
    Default: ''
    AllowedPattern: '(repo:(FCAJ-OJT-Fall26/tindy-platform-frontend|FCAJ-OJT-Fall26@[0-9]+/tindy-platform-frontend@[0-9]+):ref:refs/heads/main)?'
    Description: Exact subject emitted for the frontend repository on main. Use the format configured in GitHub.

  FrontendDeployDistributionId:
    Type: String
    Default: ''
    AllowedPattern: '[A-Z0-9]*'
    Description: DistributionId output from tindy-edge. Required together with FrontendDeployOidcSubject.

  BackendDeployEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Allow manual backend releases from the Tindy backend repository on main.

  BackendApiExecutionRoleName:
    Type: String
    Default: ''
    AllowedPattern: '(tindy-runtime-ApiExecutionRole-[A-Za-z0-9]+)?'
    Description: Execution role name from the running API task definition.

  BackendApiTaskRoleName:
    Type: String
    Default: ''
    AllowedPattern: '(tindy-runtime-ApiTaskRole-[A-Za-z0-9]+)?'
    Description: Task role name from the running API task definition.

Rules:
  InfraPlannerInputs:
    RuleCondition: !Equals [!Ref InfraPlannerEnabled, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubOidcProviderMode, Disabled]]
        AssertDescription: Enable GitHub OIDC before enabling the infrastructure planner.

  FrontendDeployInputs:
    Assertions:
      - Assert: !Or
          - !And
              - !Equals [!Ref FrontendDeployOidcSubject, '']
              - !Equals [!Ref FrontendDeployDistributionId, '']
          - !And
              - !Not [!Equals [!Ref GitHubOidcProviderMode, Disabled]]
              - !Not [!Equals [!Ref FrontendDeployOidcSubject, '']]
              - !Not [!Equals [!Ref FrontendDeployDistributionId, '']]
        AssertDescription: Provide both frontend deploy parameters and enable GitHub OIDC, or leave both parameters empty.

  BackendDeployInputs:
    RuleCondition: !Equals [!Ref BackendDeployEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref GitHubOidcProviderMode, Disabled]]
          - !Not [!Equals [!Ref BackendApiExecutionRoleName, '']]
          - !Not [!Equals [!Ref BackendApiTaskRoleName, '']]
        AssertDescription: Enable GitHub OIDC and provide both API role names to enable backend releases.

Conditions:
  CreateInfraPlannerRole: !Equals [!Ref InfraPlannerEnabled, 'true']
  CreateGitHubOidcProvider: !Equals [!Ref GitHubOidcProviderMode, Create]
  UseGitHubOidcProvider: !Not [!Equals [!Ref GitHubOidcProviderMode, Disabled]]
  CreateFrontendDeployRole: !And
    - !Condition UseGitHubOidcProvider
    - !Not [!Equals [!Ref FrontendDeployOidcSubject, '']]
    - !Not [!Equals [!Ref FrontendDeployDistributionId, '']]
  CreateBackendDeployRole: !Equals [!Ref BackendDeployEnabled, 'true']

# Set Project=Tindy, Environment=tindy, and Owner on the stack at deployment.
Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireOldFrontendVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
      Tags:
        - Key: Name
          Value: tindy-frontend
      # The Edge stack owns the frontend bucket policy and restricts OAC to its distribution.

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Retained database snapshots can reference historical media object versions.
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: tindy-media

  MediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref MediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt MediaBucket.Arn
              - !Sub '${MediaBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
                aws:PrincipalIsAWSService: 'false'

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: tindy-api
      EmptyOnDelete: false
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  JwtSigningKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: tindy/auth/jwt-signing-key
      Description: Base64-encoded JWT signing key for the Tindy API. Populated after provisioning.

  GoogleOAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: tindy/auth/google-oauth
      Description: Google OAuth client ID and client secret. Populated after provisioning.

  GitHubOAuthSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: tindy/auth/github-oauth
      Description: GitHub OAuth client ID and client secret. Populated after provisioning.

  DatabaseConnectionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Name: tindy/database/api-connection
      Description: Tindy API PostgreSQL connection string. Populated after database provisioning.

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  FrontendDeployRole:
    Type: AWS::IAM::Role
    Condition: CreateFrontendDeployRole
    Properties:
      Description: Publishes the Tindy frontend from GitHub Actions on main.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref FrontendDeployOidcSubject
      Policies:
        - PolicyName: PublishFrontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListFrontendObjects
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FrontendBucket.Arn
              - Sid: UploadFrontendObjects
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub '${FrontendBucket.Arn}/*'
              - Sid: InvalidateFrontendCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDeployDistributionId}'

  BackendDeployRole:
    Type: AWS::IAM::Role
    Condition: CreateBackendDeployRole
    Properties:
      Description: Publishes the Tindy API image and updates its ECS service from GitHub Actions on main.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:FCAJ-OJT-Fall26@337909751/tindy-platform-backend@1406859196:ref:refs/heads/main
      Policies:
        - PolicyName: PublishBackend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthenticateToEcr
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PublishApiImage
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ApiRepository.Arn
              - Sid: ReadTaskDefinition
                Effect: Allow
                Action: ecs:DescribeTaskDefinition
                Resource: '*'
              - Sid: RegisterApiTaskDefinition
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/tindy-runtime-api:*'
              - Sid: ReadApiService
                Effect: Allow
                Action: ecs:DescribeServices
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/tindy-runtime/tindy-api'
              - Sid: DeployApiTaskDefinition
                Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/tindy-runtime/tindy-api'
                Condition:
                  ArnLike:
                    ecs:task-definition: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/tindy-runtime-api:*'
              - Sid: PassApiTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BackendApiExecutionRoleName}'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BackendApiTaskRoleName}'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  InfraPlannerRole:
    Type: AWS::IAM::Role
    Condition: CreateInfraPlannerRole
    Properties:
      Description: Prepares CloudFormation Change Sets for Tindy stacks from GitHub Actions on main.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: repo:FCAJ-OJT-Fall26@337909751/tindy-infrastructure@1453488603:ref:refs/heads/main
      Policies:
        - PolicyName: PlanTindyStacks
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-foundation/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-network/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-edge/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-database/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-runtime/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/tindy-integrations/*'

Outputs:
  InfraPlannerRoleArn:
    Condition: CreateInfraPlannerRole
    Value: !GetAtt InfraPlannerRole.Arn

  FrontendBucketName:
    Value: !Ref FrontendBucket

  FrontendBucketArn:
    Value: !GetAtt FrontendBucket.Arn

  FrontendBucketRegionalDomainName:
    Description: Regional S3 REST origin for CloudFront.
    Value: !GetAtt FrontendBucket.RegionalDomainName

  MediaBucketName:
    Value: !Ref MediaBucket

  MediaBucketArn:
    Value: !GetAtt MediaBucket.Arn

  ApiRepositoryArn:
    Value: !GetAtt ApiRepository.Arn

  ApiRepositoryUri:
    Value: !GetAtt ApiRepository.RepositoryUri

  JwtSigningKeySecretArn:
    Value: !Ref JwtSigningKeySecret

  GoogleOAuthSecretArn:
    Value: !Ref GoogleOAuthSecret

  GitHubOAuthSecretArn:
    Value: !Ref GitHubOAuthSecret

  DatabaseConnectionSecretArn:
    Value: !Ref DatabaseConnectionSecret

  DataProtectionParameterPath:
    Description: Reserved SSM path for ASP.NET Core keys created by the API at runtime.
    Value: /tindy/data-protection

  GitHubOidcProviderArn:
    Condition: UseGitHubOidcProvider
    Value: !If
      - CreateGitHubOidcProvider
      - !Ref GitHubOidcProvider
      - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'

  FrontendDeployRoleArn:
    Condition: CreateFrontendDeployRole
    Value: !GetAtt FrontendDeployRole.Arn

  BackendDeployRoleArn:
    Condition: CreateBackendDeployRole
    Value: !GetAtt BackendDeployRole.Arn
