AWSTemplateFormatVersion: '2010-09-09'
Description: Tindy ECS Fargate API, internal ALB, and CloudFront VPC Origin.

Parameters:
  ApiImage:
    Type: String
    Description: Verified tindy-api ECR image URI pinned to its digest.
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.us-east-1\.amazonaws\.com/tindy-api@sha256:[0-9a-f]{64}'

  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Start at zero. Set to one after database preparation and API secrets are ready.

  VpcId:
    Type: AWS::EC2::VPC::Id

  PublicTaskSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  PrivateAppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>

  AlbSubnetCidrs:
    Type: CommaDelimitedList
    Description: Two private ALB subnet CIDRs from tindy-network.

  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  EcsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  CloudFrontOriginPrefixListId:
    Type: String
    Default: ''
    AllowedPattern: '(pl-[0-9a-f]+)?'
    Description: IPv4 com.amazonaws.global.cloudfront.origin-facing prefix list ID for bootstrap.

  CloudFrontServiceSecurityGroupId:
    Type: String
    Default: ''
    AllowedPattern: '(sg-[0-9a-f]+)?'
    Description: Use the service-managed group after VPC Origin deploys. Clear this and use the prefix list before teardown.

  CloudFrontPublicHost:
    Type: String
    AllowedPattern: '[a-z0-9-]+\.cloudfront\.net'
    Description: DistributionDomainName output from tindy-edge.

  DatabaseConnectionSecretArn:
    Type: String
    Description: Foundation secret ARN holding the API PostgreSQL password and connectionString as JSON keys.

  JwtSigningKeySecretArn:
    Type: String
    Description: Foundation secret ARN holding the Base64 JWT signing key as SecretString.

  OAuthEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']

  GoogleOAuthSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '(arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:tindy/auth/google-oauth-[a-zA-Z0-9]{6})?'
    Description: Foundation secret ARN containing clientId and clientSecret JSON keys for Google.

  GitHubOAuthSecretArn:
    Type: String
    Default: ''
    AllowedPattern: '(arn:aws:secretsmanager:us-east-1:[0-9]{12}:secret:tindy/auth/github-oauth-[a-zA-Z0-9]{6})?'
    Description: Foundation secret ARN containing clientId and clientSecret JSON keys for GitHub.

  AiPdfUploadsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable AI PDF quarantine uploads after the media scan stack and database schema are ready.
  BedrockTextEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable text extraction through Bedrock Mantle using the API task role.
  MediaEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable S3 media, cleanup, and the GuardDuty certificate scan worker together.

  MediaBucketName:
    Type: String
    Default: tindy-media-not-configured
    AllowedPattern: '[a-z0-9][a-z0-9-]{1,61}[a-z0-9]'
    Description: MediaBucketName output from tindy-foundation.

  GuardDutyProtectionPlanArn:
    Type: String
    Default: ''
    AllowedPattern: '(arn:aws:guardduty:us-east-1:[0-9]{12}:malware-protection-plan/[A-Za-z0-9-]+)?'
    Description: GuardDutyProtectionPlanArn output from tindy-integrations.

  GuardDutyQueueUrl:
    Type: String
    Default: ''
    AllowedPattern: '(https://sqs\.us-east-1\.amazonaws\.com/[0-9]{12}/tindy-integrations-pdf-scan)?'
    Description: GuardDutyQueueUrl output from tindy-integrations.

  DataProtectionParameterPath:
    Type: String
    Default: /tindy/data-protection
    AllowedPattern: '/[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*'
    Description: Dedicated SSM path from tindy-foundation for API Data Protection keys.

  DBProvisionMode:
    Type: String
    Default: Fresh
    AllowedValues: [Fresh, Restore]
    Description: DBProvisionMode output from tindy-database.

  MigrationConnectionSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN holding the migration PostgreSQL password and connectionString as JSON keys.

  SeedPasswordSecretArn:
    Type: String
    Default: ''
    Description: Optional ARN for the Fresh seed password as SecretString.

  DBEndpointAddress:
    Type: String
    Default: ''
    AllowedPattern: '([a-z0-9.-]+\.rds\.amazonaws\.com)?'
    Description: DBEndpointAddress output from tindy-database for the Fresh bootstrap task.

  DBMasterSecretArn:
    Type: String
    Default: ''
    Description: DBMasterSecretArn output from tindy-database. Used only by the Fresh bootstrap task.

Rules:
  RequireMediaForAiPdfUploads:
    RuleCondition: !Equals [!Ref AiPdfUploadsEnabled, 'true']
    Assertions:
      - Assert: !Equals [!Ref MediaEnabled, 'true']
        AssertDescription: AI PDF uploads require the media storage and GuardDuty integration.

  RequireMediaIntegration:
    RuleCondition: !Equals [!Ref MediaEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref MediaBucketName, tindy-media-not-configured]]
          - !Not [!Equals [!Ref GuardDutyProtectionPlanArn, '']]
          - !Not [!Equals [!Ref GuardDutyQueueUrl, '']]
        AssertDescription: Enabling media requires the media bucket, protection plan ARN, and local certificate scan queue.

  RequireOAuthSecrets:
    RuleCondition: !Equals [!Ref OAuthEnabled, 'true']
    Assertions:
      - Assert: !And
          - !Not [!Equals [!Ref GoogleOAuthSecretArn, '']]
          - !Not [!Equals [!Ref GitHubOAuthSecretArn, '']]
        AssertDescription: Enabling OAuth requires both provider secret ARNs.

  RequireCloudFrontIngressSource:
    Assertions:
      - Assert: !Or
          - !Not [!Equals [!Ref CloudFrontOriginPrefixListId, '']]
          - !Not [!Equals [!Ref CloudFrontServiceSecurityGroupId, '']]
        AssertDescription: Supply the CloudFront IPv4 prefix list or its service-managed security group.

Conditions:
  EnableBedrockText: !Equals [!Ref BedrockTextEnabled, 'true']
  EnableMedia: !Equals [!Ref MediaEnabled, 'true']
  EnableOAuth: !Equals [!Ref OAuthEnabled, 'true']
  UseCloudFrontServiceSecurityGroup: !Not [!Equals [!Ref CloudFrontServiceSecurityGroupId, '']]
  HasMigrationSecret: !Not [!Equals [!Ref MigrationConnectionSecretArn, '']]
  EnableFreshBootstrap: !And
    - !Condition HasMigrationSecret
    - !Equals [!Ref DBProvisionMode, Fresh]
    - !Not [!Equals [!Ref DBEndpointAddress, '']]
    - !Not [!Equals [!Ref DBMasterSecretArn, '']]
  EnableFreshSeed: !And
    - !Condition HasMigrationSecret
    - !Equals [!Ref DBProvisionMode, Fresh]
    - !Not [!Equals [!Ref SeedPasswordSecretArn, '']]

# Set Project=Tindy, Environment=tindy, and Owner on the stack at deployment.
Resources:
  RuntimeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 14

  TaskExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Pull the Tindy API image and write logs for Tindy runtime tasks.
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: '*'
          - Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/tindy-api'
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${RuntimeLogGroup}:log-stream:*'

  ApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      ManagedPolicyArns: [!Ref TaskExecutionPolicy]
      Policies:
        - PolicyName: ReadApiStartupSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseConnectionSecretArn, !Ref JwtSigningKeySecretArn]
              - !If
                - EnableOAuth
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:tindy/auth/google-oauth-??????'
                    - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:tindy/auth/github-oauth-??????'
                - !Ref AWS::NoValue

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      Policies:
        - PolicyName: PersistDataProtectionKeys
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ssm:GetParametersByPath
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DataProtectionParameterPath}'
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DataProtectionParameterPath}/*'
              - Effect: Allow
                Action: ssm:PutParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DataProtectionParameterPath}/*'
        - !If
          - EnableBedrockText
          - PolicyName: InvokeGemmaThroughBedrockMantle
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: bedrock-mantle:CreateInference
                  Resource: !Sub 'arn:${AWS::Partition}:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/default'
                  Condition:
                    StringEquals:
                      'bedrock-mantle:Model': google.gemma-4-31b
          - !Ref AWS::NoValue
        - !If
          - EnableMedia
          - PolicyName: ManagePrivateMediaAndConsumeScanResults
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Sid: ManageMediaObjects
                  Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:GetObjectVersion
                    - s3:DeleteObject
                    - s3:DeleteObjectVersion
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/profiles/avatars/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/profiles/covers/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/certificates/images/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/certificates/pdf/*'
                - Sid: DetectMissingObjectsDuringCleanup
                  # S3 HeadObject returns 403 instead of 404 for missing keys without ListBucket.
                  Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}'
                - Sid: ManageAiQuarantine
                  Effect: Allow
                  Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:DeleteObjectVersion]
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/ai-input/pdf/*'
                - Sid: ReadCleanAiPdfVersion
                  Effect: Allow
                  Action: s3:GetObjectVersion
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${MediaBucketName}/ai-input/pdf/*'
                  Condition:
                    StringEquals:
                      's3:ExistingObjectTag/GuardDutyMalwareScanStatus': NO_THREATS_FOUND
                - Sid: ConsumeCertificateScanResults
                  Effect: Allow
                  Action: [sqs:GetQueueAttributes, sqs:ReceiveMessage, sqs:DeleteMessage]
                  Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:tindy-integrations-pdf-scan'
          - !Ref AWS::NoValue

  RuntimeCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref 'AWS::StackName'

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${AWS::StackName}-api'
      Cpu: '512'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt ApiExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            - { Name: ASPNETCORE_ENVIRONMENT, Value: Production }
            - { Name: ASPNETCORE_HTTP_PORTS, Value: '8080' }
            - { Name: CloudFrontProxy__Enabled, Value: 'true' }
            - { Name: CloudFrontProxy__PublicHost, Value: !Ref CloudFrontPublicHost }
            - { Name: CloudFrontProxy__TrustedProxyNetworks__0, Value: !Select [0, !Ref AlbSubnetCidrs] }
            - { Name: CloudFrontProxy__TrustedProxyNetworks__1, Value: !Select [1, !Ref AlbSubnetCidrs] }
            - { Name: DataProtection__SsmParameterPath, Value: !Ref DataProtectionParameterPath }
            - { Name: Bedrock__Enabled, Value: !Ref BedrockTextEnabled }
            - { Name: Bedrock__UseSigV4, Value: !Ref BedrockTextEnabled }
            - { Name: Bedrock__Region, Value: !Ref 'AWS::Region' }
            - { Name: MediaLifecycle__Enabled, Value: !Ref MediaEnabled }
            - { Name: GuardDuty__Enabled, Value: !Ref MediaEnabled }
            - { Name: GuardDuty__AiPdfUploadsEnabled, Value: !Ref AiPdfUploadsEnabled }
            - !If
              - EnableMedia
              - { Name: MediaStorage__Provider, Value: s3 }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: MediaStorage__S3__BucketName, Value: !Ref MediaBucketName }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: MediaStorage__S3__Region, Value: !Ref 'AWS::Region' }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: GuardDuty__BucketName, Value: !Ref MediaBucketName }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: GuardDuty__Region, Value: !Ref 'AWS::Region' }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: GuardDuty__AccountId, Value: !Ref 'AWS::AccountId' }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: GuardDuty__ProtectionPlanArn, Value: !Ref GuardDutyProtectionPlanArn }
              - !Ref AWS::NoValue
            - !If
              - EnableMedia
              - { Name: GuardDuty__QueueUrl, Value: !Ref GuardDutyQueueUrl }
              - !Ref AWS::NoValue
            - { Name: OAuth__Enabled, Value: !Ref OAuthEnabled }
            - !If
              - EnableOAuth
              - { Name: OAuth__Frontend__AllowedOrigins__0, Value: !Sub 'https://${CloudFrontPublicHost}' }
              - !Ref AWS::NoValue
          Secrets:
            - { Name: ConnectionStrings__DefaultConnection, ValueFrom: !Sub '${DatabaseConnectionSecretArn}:connectionString::' }
            - { Name: Jwt__SigningKey, ValueFrom: !Ref JwtSigningKeySecretArn }
            - !If
              - EnableOAuth
              - { Name: OAuth__Google__ClientId, ValueFrom: !Sub '${GoogleOAuthSecretArn}:clientId::' }
              - !Ref AWS::NoValue
            - !If
              - EnableOAuth
              - { Name: OAuth__Google__ClientSecret, ValueFrom: !Sub '${GoogleOAuthSecretArn}:clientSecret::' }
              - !Ref AWS::NoValue
            - !If
              - EnableOAuth
              - { Name: OAuth__GitHub__ClientId, ValueFrom: !Sub '${GitHubOAuthSecretArn}:clientId::' }
              - !Ref AWS::NoValue
            - !If
              - EnableOAuth
              - { Name: OAuth__GitHub__ClientSecret, ValueFrom: !Sub '${GitHubOAuthSecretArn}:clientSecret::' }
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: api

  AlbIngressFromCloudFront:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroupId
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourcePrefixListId: !If [UseCloudFrontServiceSecurityGroup, !Ref 'AWS::NoValue', !Ref CloudFrontOriginPrefixListId]
      SourceSecurityGroupId: !If [UseCloudFrontServiceSecurityGroup, !Ref CloudFrontServiceSecurityGroupId, !Ref 'AWS::NoValue']

  InternalAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: AlbIngressFromCloudFront
    Properties:
      Type: application
      Scheme: internal
      IpAddressType: ipv4
      Subnets: !Ref PrivateAppSubnetIds
      SecurityGroups: [!Ref AlbSecurityGroupId]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '125'

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /api/health/ready
      Matcher: { HttpCode: '200' }

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref InternalAlb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup

  RuntimeVpcOrigin:
    Type: AWS::CloudFront::VpcOrigin
    DependsOn: AlbListener
    Properties:
      VpcOriginEndpointConfig:
        Name: !Sub '${AWS::StackName}-alb'
        Arn: !Ref InternalAlb
        HTTPPort: 80
        OriginProtocolPolicy: http-only
        IpAddressType: ipv4

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      ServiceName: tindy-api
      Cluster: !Ref RuntimeCluster
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref ApiTaskDefinition
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicTaskSubnetIds
          SecurityGroups: [!Ref EcsSecurityGroupId]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8080
          TargetGroupArn: !Ref ApiTargetGroup

  DbBootstrapExecutionRole:
    Type: AWS::IAM::Role
    Condition: EnableFreshBootstrap
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      Policies:
        - PolicyName: BootstrapSecretsAndLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DBMasterSecretArn, !Ref DatabaseConnectionSecretArn, !Ref MigrationConnectionSecretArn]
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${RuntimeLogGroup}:log-stream:db-bootstrap/*'

  DbBootstrapTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: EnableFreshBootstrap
    Properties:
      Family: !Sub '${AWS::StackName}-db-bootstrap'
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt DbBootstrapExecutionRole.Arn
      ContainerDefinitions:
        - Name: db-bootstrap
          Image: docker.io/library/postgres@sha256:4717f90960a225c2d1c5dac50508c401230f693ff626e06e84e6db0a68ded508
          Essential: true
          User: postgres
          EntryPoint: [/bin/sh, -ec]
          Command:
            - |
              umask 077
              export PGSSLROOTCERT=/tmp/rds-ca.pem
              wget -q -O "$PGSSLROOTCERT" https://truststore.pki.rds.amazonaws.com/us-east-1/us-east-1-bundle.pem

              echo 'Creating PostgreSQL roles over verified TLS.'
              # Keep password-bearing SQL out of task logs even if psql reports an error.
              if ! psql -Xqw -v ON_ERROR_STOP=1 >/dev/null 2>&1 <<'SQL'
              \getenv api_password TINDY_API_PASSWORD
              \getenv migration_password TINDY_MIGRATION_PASSWORD
              BEGIN;
              SELECT pg_advisory_xact_lock(204817, 9);
              SELECT format('CREATE ROLE tindy_api LOGIN PASSWORD %L', :'api_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tindy_api')
              \gexec
              SELECT format('CREATE ROLE tindy_migrator LOGIN PASSWORD %L', :'migration_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'tindy_migrator')
              \gexec
              REVOKE CREATE ON SCHEMA public FROM PUBLIC;
              GRANT CONNECT ON DATABASE tindy TO tindy_api, tindy_migrator;
              GRANT USAGE ON SCHEMA public TO tindy_api;
              GRANT USAGE, CREATE ON SCHEMA public TO tindy_migrator;
              COMMIT;
              SQL
              then
                echo 'Database bootstrap failed while creating roles. Check RDS reachability, TLS and the master credential.' >&2
                exit 1
              fi

              echo 'Configuring grants for objects created by the migration role.'
              PGUSER=tindy_migrator PGPASSWORD="$TINDY_MIGRATION_PASSWORD" psql -Xqw -v ON_ERROR_STOP=1 <<'SQL'
              BEGIN;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tindy_api;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO tindy_api;
              COMMIT;
              SQL

              echo 'Checking the API role over verified TLS.'
              api_check=$(PGUSER=tindy_api PGPASSWORD="$TINDY_API_PASSWORD" psql -XwAt -v ON_ERROR_STOP=1 -c "SELECT has_schema_privilege(current_user, 'public', 'USAGE') AND NOT has_schema_privilege(current_user, 'public', 'CREATE');")
              if [ "$api_check" != t ]; then
                echo 'Unexpected API privileges on the public schema.' >&2
                exit 1
              fi
              echo 'Database bootstrap complete.'
          Environment:
            - { Name: PGHOST, Value: !Ref DBEndpointAddress }
            - { Name: PGPORT, Value: '5432' }
            - { Name: PGDATABASE, Value: tindy }
            - { Name: PGSSLMODE, Value: verify-full }
            - { Name: PGCONNECT_TIMEOUT, Value: '10' }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${DBMasterSecretArn}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${DBMasterSecretArn}:password::' }
            - { Name: TINDY_API_PASSWORD, ValueFrom: !Sub '${DatabaseConnectionSecretArn}:password::' }
            - { Name: TINDY_MIGRATION_PASSWORD, ValueFrom: !Sub '${MigrationConnectionSecretArn}:password::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: db-bootstrap

  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Condition: HasMigrationSecret
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      ManagedPolicyArns: [!Ref TaskExecutionPolicy]
      Policies:
        - PolicyName: ReadMigrationSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref MigrationConnectionSecretArn

  MigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: HasMigrationSecret
    Properties:
      Family: !Sub '${AWS::StackName}-migration'
      Cpu: '512'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      ContainerDefinitions:
        - Name: migration
          Image: !Ref ApiImage
          Essential: true
          Command: [migrate-db]
          Environment:
            - { Name: DOTNET_ENVIRONMENT, Value: Production }
          Secrets:
            - { Name: ConnectionStrings__DefaultConnection, ValueFrom: !Sub '${MigrationConnectionSecretArn}:connectionString::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: migration

  SeedExecutionRole:
    Type: AWS::IAM::Role
    Condition: EnableFreshSeed
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { 'aws:SourceAccount': !Ref 'AWS::AccountId' }
      ManagedPolicyArns: [!Ref TaskExecutionPolicy]
      Policies:
        - PolicyName: ReadSeedSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref MigrationConnectionSecretArn, !Ref SeedPasswordSecretArn]

  SeedTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: EnableFreshSeed
    Properties:
      Family: !Sub '${AWS::StackName}-seed'
      Cpu: '512'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { OperatingSystemFamily: LINUX, CpuArchitecture: X86_64 }
      ExecutionRoleArn: !GetAtt SeedExecutionRole.Arn
      ContainerDefinitions:
        - Name: seed
          Image: !Ref ApiImage
          Essential: true
          Command: [seed-demo, --fresh]
          Environment:
            - { Name: DOTNET_ENVIRONMENT, Value: Production }
          Secrets:
            - { Name: ConnectionStrings__DefaultConnection, ValueFrom: !Sub '${MigrationConnectionSecretArn}:connectionString::' }
            - { Name: DemoSeed__Password, ValueFrom: !Ref SeedPasswordSecretArn }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref RuntimeLogGroup
              awslogs-region: !Ref 'AWS::Region'
              awslogs-stream-prefix: seed

Outputs:
  ClusterName:
    Value: !Ref RuntimeCluster

  ApiServiceName:
    Value: !GetAtt ApiService.Name

  ApiTaskDefinitionArn:
    Value: !Ref ApiTaskDefinition

  DbBootstrapTaskDefinitionArn:
    Condition: EnableFreshBootstrap
    Value: !Ref DbBootstrapTaskDefinition

  MigrationTaskDefinitionArn:
    Condition: HasMigrationSecret
    Value: !Ref MigrationTaskDefinition

  SeedTaskDefinitionArn:
    Condition: EnableFreshSeed
    Value: !Ref SeedTaskDefinition

  ApiTargetGroupArn:
    Value: !Ref ApiTargetGroup

  AlbDnsName:
    Value: !GetAtt InternalAlb.DNSName

  VpcOriginId:
    Value: !GetAtt RuntimeVpcOrigin.Id
