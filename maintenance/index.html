<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tindy đang bảo trì</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        place-items: center;
        background: #f5f6fa;
        color: #182035;
        font: 1rem/1.6 system-ui, sans-serif;
      }

      main {
        width: min(100%, 32rem);
        padding: clamp(1.5rem, 6vw, 3rem);
        box-sizing: border-box;
        border: 1px solid #dbe0ec;
        border-radius: 1rem;
        background: #fff;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        line-height: 1.2;
      }

      p { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tindy đang bảo trì</h1>
      <p>Vui lòng quay lại sau.</p>
    </main>
  </body>
</html>
