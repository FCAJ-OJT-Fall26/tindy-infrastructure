name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint==1.60.0

      - name: Lint CloudFormation templates
        run: cfn-lint --regions us-east-1 --non-zero-exit-code error --template cloudformation/*.yaml

      - name: Summarize CloudFormation changes offline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/compare-cloudformation.py "$BASE_SHA" HEAD >> "$GITHUB_STEP_SUMMARY"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install cfn-nag
        run: gem install cfn-nag --version 0.8.10 --no-document

      - name: Scan CloudFormation templates
        run: cfn_nag_scan --input-path cloudformation
