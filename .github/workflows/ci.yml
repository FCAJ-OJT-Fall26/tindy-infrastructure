name: Infrastructure CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-cloudformation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install CloudFormation linter
        run: python -m pip install cfn-lint==1.60.0

      - name: Lint CloudFormation templates
        run: cfn-lint --regions us-east-1 --non-zero-exit-code error --template cloudformation/*.yaml
